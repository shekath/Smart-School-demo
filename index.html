<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Banksia Grove School — Smart School Platform (Demo)</title>
<style>
:root{
  --primary:#1F5AF6;--on-primary:#fff;--primary-c:#E4EBFF;--on-primary-c:#0B2A8A;
  --navy:#0F1F3D;--ink:#1B2437;--ink-2:#54607A;--ink-3:#8A94AB;
  --bg:#F3F5FA;--surface:#FFFFFF;--surface-2:#F8FAFD;--outline:#DEE3EC;--outline-2:#EEF1F6;
  --green:#12A150;--green-c:#E2F6EA;--orange:#F07F1A;--orange-c:#FFF0E1;--teal:#0F9D93;--teal-c:#DDF5F2;
  --red:#D6392F;--red-c:#FCE7E5;--purple:#6D4BE0;--purple-c:#ECE6FF;--yellow:#E5A400;--yellow-c:#FFF6D8;
  --admin:#1F5AF6;--teacher:#12A150;--student:#0F9D93;
  --r-s:10px;--r-m:16px;--r-l:24px;
  --shadow-1:0 1px 2px rgba(15,31,61,.06),0 1px 3px rgba(15,31,61,.04);
  --shadow-2:0 6px 20px rgba(15,31,61,.10),0 2px 6px rgba(15,31,61,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Inter,Arial,sans-serif;
  --nav-h:64px;--top-h:60px;--rail-w:84px;--drawer-w:264px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;min-height:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px}
p{margin:0}
.ico{width:24px;height:24px;fill:currentColor;flex:none;display:inline-block;vertical-align:middle}
.ico.sm{width:18px;height:18px}
.ico.lg{width:32px;height:32px}
:focus-visible{outline:3px solid #9DB6FF;outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hidden{display:none!important}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.small{font-size:13px}
.strong{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:16px}.mb{margin-bottom:16px}.mt-s{margin-top:8px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}
.center{text-align:center}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--bg)}
.login-hero{background:var(--navy);color:#fff;padding:36px 24px 28px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;position:relative;overflow:hidden}
.login-hero .crest{width:52px;height:52px;border-radius:14px;background:var(--primary);display:grid;place-items:center;margin-bottom:6px}
.login-hero h1{font-size:30px;line-height:1.15;max-width:22ch}
.login-hero p{color:#B9C4DC;max-width:44ch}
.login-hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.login-hero .pill{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:13px;color:#DCE3F3}
.login-hero .glow{position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(31,90,246,.55),transparent)}
.login-body{padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;max-width:520px;width:100%;margin:0 auto}
.role-cards{display:grid;gap:12px}
.role-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--outline);border-radius:var(--r-m);padding:14px 16px;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.role-card:active{transform:scale(.99)}
.role-card:hover{border-color:var(--primary)}
.role-card .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.role-card .who{flex:1;min-width:0}
.role-card .who b{display:block}
.role-card .who span{color:var(--ink-2);font-size:13px}
.divider-text{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.divider-text:before,.divider-text:after{content:"";flex:1;height:1px;background:var(--outline)}
@media (min-width:900px){
  .login{grid-template-columns:1.1fr 1fr;min-height:100vh}
  .login-hero{padding:56px;justify-content:center}
  .login-hero h1{font-size:40px}
  .login-body{justify-content:center;padding:56px 48px}
}

/* ---------- Shell ---------- */
.shell{display:grid;min-height:100vh;grid-template-rows:var(--top-h) 1fr;grid-template-columns:minmax(0,1fr)}
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);background:rgba(243,245,250,.88);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--outline-2)}
.topbar .ttl{flex:1;min-width:0;font-size:18px;font-weight:600}
.topbar .ttl small{display:block;font-size:12px;font-weight:400;color:var(--ink-2)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;transition:background .15s}
.icon-btn:hover{background:rgba(15,31,61,.06)}
.icon-btn .badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.content{padding:16px 16px calc(var(--nav-h) + 24px + var(--safe-b));max-width:1180px;width:100%;margin:0 auto;min-width:0}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--surface);border-top:1px solid var(--outline-2);display:flex;justify-content:space-around}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-2);padding:6px 2px}
.bottom-nav button .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.bottom-nav button.on{color:var(--ink)}
.bottom-nav button.on .pill{background:var(--primary-c);color:var(--on-primary-c)}
.rail,.drawer{display:none}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + var(--safe-b));z-index:29;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 8px 24px rgba(31,90,246,.35)}
@media (min-width:840px){
  .shell{grid-template-columns:var(--rail-w) minmax(0,1fr)}
  .topbar{grid-column:2}
  .content{grid-column:2;padding:24px 28px 48px}
  .bottom-nav,.fab{display:none}
  .rail{display:flex;flex-direction:column;align-items:center;gap:4px;grid-row:1/3;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--outline-2);padding:14px 8px}
  .rail .brand{width:48px;height:48px;border-radius:14px;background:var(--navy);display:grid;place-items:center;color:#fff;margin-bottom:12px}
  .rail button.nav{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink-2);padding:8px 0}
  .rail button.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
  .rail button.nav.on{color:var(--ink)}
  .rail button.nav.on .pill{background:var(--primary-c);color:var(--on-primary-c)}
  .rail .spacer{flex:1}
  .rail .primary-action{width:56px;height:56px;border-radius:16px;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;margin-bottom:8px}
}
@media (min-width:1200px){
  .shell{grid-template-columns:var(--drawer-w) minmax(0,1fr)}
  .rail{display:none}
  .drawer{display:flex;flex-direction:column;grid-row:1/3;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--outline-2);padding:20px 14px}
  .drawer .brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
  .drawer .brand .mark{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff}
  .drawer .brand b{display:block;font-size:15px}
  .drawer .brand span{font-size:12px;color:var(--ink-2)}
  .drawer .primary-action{display:flex;align-items:center;gap:10px;height:52px;padding:0 20px;border-radius:16px;background:var(--primary-c);color:var(--on-primary-c);font-weight:600;margin:0 4px 14px}
  .drawer button.nav{display:flex;align-items:center;gap:14px;height:48px;padding:0 16px;border-radius:24px;color:var(--ink-2);font-weight:500;width:100%;text-align:left}
  .drawer button.nav:hover{background:var(--surface-2)}
  .drawer button.nav.on{background:var(--primary-c);color:var(--on-primary-c)}
  .drawer .spacer{flex:1}
  .drawer .me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--outline-2)}
  .drawer .me b{display:block;font-size:14px}
  .drawer .me span{font-size:12px;color:var(--ink-2)}
}

/* ---------- Components ---------- */
.card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-m);padding:16px;min-width:0}
.card.tint{background:var(--surface-2)}
.card.flat{border:0;box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:16px}
.card-h .link{font-size:13px;font-weight:600;color:var(--primary)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:839px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:840px){.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}.cols-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}}
.kpi{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:104px}
.kpi .lab{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi .sub{font-size:12px;color:var(--ink-3)}
.kpi .val.blue{color:var(--primary)}.kpi .val.green{color:var(--green)}.kpi .val.orange{color:var(--orange)}.kpi .val.teal{color:var(--teal)}.kpi .val.red{color:var(--red)}
.tile{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-m);padding:16px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--primary)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tile b{font-size:15px}
.tile span{font-size:13px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;font-weight:600;font-size:14px;background:var(--primary);color:#fff;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn.outline{background:transparent;border:1.5px solid var(--outline);color:var(--ink)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--primary-c);border-color:transparent;color:var(--on-primary-c)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.blue{background:var(--primary-c);color:var(--on-primary-c)}
.tag.green{background:var(--green-c);color:#0B6B33}
.tag.orange{background:var(--orange-c);color:#9A4D05}
.tag.teal{background:var(--teal-c);color:#0A6F68}
.tag.red{background:var(--red-c);color:#9A1F17}
.tag.purple{background:var(--purple-c);color:#4629A6}
.tag.yellow{background:var(--yellow-c);color:#7A5600}
.tag.grey{background:var(--outline-2);color:var(--ink-2)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--outline-2);text-align:left;width:100%;min-width:0}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14.5px;font-weight:600}
.item .tx>span{display:block;font-size:13px;color:var(--ink-2)}
.item .tx .tag{display:inline-flex;color:inherit}
.item .tx .desc{font-size:13.5px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.unread .tx b:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:8px;vertical-align:middle}
.item.click{cursor:pointer;border-radius:8px}
.item.click:hover{background:var(--surface-2)}
.ic.blue{background:var(--primary-c);color:var(--on-primary-c)}.ic.green{background:var(--green-c);color:#0B6B33}.ic.orange{background:var(--orange-c);color:#9A4D05}.ic.teal{background:var(--teal-c);color:#0A6F68}.ic.red{background:var(--red-c);color:#9A1F17}.ic.purple{background:var(--purple-c);color:#4629A6}.ic.yellow{background:var(--yellow-c);color:#7A5600}.ic.grey{background:var(--outline-2);color:var(--ink-2)}.ic.navy{background:var(--navy);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{height:46px;border:1.5px solid var(--outline);border-radius:12px;padding:0 14px;background:var(--surface);width:100%;outline:none;transition:border-color .15s}
.field textarea{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,90,246,.12)}
.field .help{font-size:12px;color:var(--ink-3)}
.seg{display:flex;background:var(--outline-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch .tg{width:48px;height:28px;border-radius:14px;background:var(--outline);position:relative;transition:background .15s;flex:none}
.switch .tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:var(--shadow-1)}
.switch .tg.on{background:var(--primary)}
.switch .tg.on:after{transform:translateX(20px)}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bar-chart .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-chart .b i{display:block;width:100%;max-width:40px;border-radius:6px 6px 3px 3px;background:var(--primary);transition:height .4s}
.bar-chart .b i.low{background:var(--orange)}
.bar-chart .b span{font-size:11px;color:var(--ink-3)}
.progress{height:8px;border-radius:4px;background:var(--outline-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .4s}
.progress i.green{background:var(--green)}.progress i.orange{background:var(--orange)}.progress i.teal{background:var(--teal)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--outline)}
.table td{padding:11px 10px;border-bottom:1px solid var(--outline-2);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 10px}
.section-h h2{font-size:17px}
.section-h .link{font-size:13px;font-weight:600;color:var(--primary)}
.page-h{margin-bottom:16px}
.page-h h1{font-size:24px}
.page-h p{color:var(--ink-2);margin-top:4px}
.greet{background:var(--navy);color:#fff;border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.greet:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(31,90,246,.6),transparent)}
.greet h2{font-size:22px;position:relative}
.greet p{color:#B9C4DC;position:relative}
.greet .row{position:relative;margin-top:8px;flex-wrap:wrap}
.greet .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.greet.student{background:linear-gradient(135deg,#0F9D93,#0B6F69)}
.greet.student:after{background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent)}
.greet.teacher{background:linear-gradient(135deg,#12A150,#0B6B33)}
.greet.teacher:after{background:radial-gradient(closest-side,rgba(255,255,255,.25),transparent)}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px;padding:10px 0}
.tl .t{width:52px;flex:none;font-size:13px;font-weight:600;color:var(--ink-2);padding-top:2px}
.tl .b{flex:1;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:10px 12px}
.tl .b.now{border-color:var(--primary);background:var(--primary-c)}
.tl .b b{display:block;font-size:14.5px}
.tl .b span{font-size:13px;color:var(--ink-2)}
.steps{display:flex;gap:8px;align-items:center}
.steps .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);text-align:center}
.steps .s i{width:28px;height:28px;border-radius:50%;background:var(--outline-2);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:12px;color:var(--ink-2)}
.steps .s.done i{background:var(--green);color:#fff}
.steps .s.cur i{background:var(--primary);color:#fff}
.steps .s.done,.steps .s.cur{color:var(--ink)}

/* Attendance */
.att-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--outline-2)}
.att-row:last-child{border-bottom:0}
.att-row .nm{flex:1;min-width:0}
.att-row .nm b{display:block;font-size:14.5px}
.att-row .nm span{font-size:12px;color:var(--ink-3)}
.att-btns{display:flex;gap:6px}
.att-btns button{height:36px;min-width:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--outline);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.att-btns button.P.on{background:var(--green-c);border-color:var(--green);color:#0B6B33}
.att-btns button.A.on{background:var(--red-c);border-color:var(--red);color:#9A1F17}
.att-btns button.L.on{background:var(--orange-c);border-color:var(--orange);color:#9A4D05}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;padding:6px 0}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;position:relative;background:var(--surface);border:1px solid transparent}
.cal .d.pad{background:transparent;color:var(--ink-3)}
.cal .d.today{border-color:var(--primary);font-weight:700;color:var(--primary)}
.cal .d.sel{background:var(--primary);color:#fff}
.cal .d.wk{color:var(--ink-3)}
.cal .d .dots{display:flex;gap:3px;height:6px}
.cal .d .dots i{width:6px;height:6px;border-radius:50%}
.dot.event{background:var(--primary)}.dot.holiday{background:var(--orange)}.dot.exam{background:var(--red)}
.cal .d.sel .dots i{background:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* Bus map */
.map{position:relative;background:#EAF1EA;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--outline)}
.map svg{display:block;width:100%;height:auto}
.map .status{position:absolute;top:12px;left:12px;display:flex;gap:8px}
.map .live{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;box-shadow:var(--shadow-1)}
.map .live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 0 0 8px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
.stops{display:flex;flex-direction:column}
.stop{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.stop .ln{width:24px;display:flex;flex-direction:column;align-items:center;flex:none}
.stop .ln i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--outline);background:#fff;flex:none}
.stop .ln:after{content:"";flex:1;width:2px;background:var(--outline-2);min-height:22px;margin-top:2px}
.stop:last-child .ln:after{display:none}
.stop.done .ln i{background:var(--green);border-color:var(--green)}
.stop.next .ln i{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-c)}
.stop .tx{flex:1}
.stop .tx b{display:block;font-size:14px}
.stop .tx span{font-size:12.5px;color:var(--ink-2)}
.stop .eta{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.stop.next .eta{color:var(--primary)}
.stop.done .eta{color:var(--green)}

/* Modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(15,31,61,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:10px auto 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 20px}
.sheet-h h2{flex:1;font-size:18px}
.sheet-b{padding:4px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:12px 20px calc(16px + var(--safe-b));border-top:1px solid var(--outline-2);display:flex;gap:10px;justify-content:flex-end}
.sheet-f .btn{flex:1}
@media (min-width:640px){
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:560px;border-radius:24px;max-height:86vh}
  .sheet .grab{display:none}
  .sheet-f .btn{flex:none}
}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + var(--safe-b));z-index:60;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;max-width:min(92vw,480px);animation:up .2s}
@media (min-width:840px){.snack{bottom:24px}}
.push{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;width:min(94vw,420px);background:var(--surface);border-radius:18px;box-shadow:var(--shadow-2);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:down .25s cubic-bezier(.2,.8,.2,1);border:1px solid var(--outline)}
@keyframes down{from{transform:translate(-50%,-30px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.push .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.push b{display:block;font-size:14px}
.push span{font-size:13px;color:var(--ink-2);display:block}
.push small{font-size:11px;color:var(--ink-3)}
.notif-panel{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:fade .15s}
@media (min-width:840px){.notif-panel{left:auto;top:8px;right:8px;bottom:auto;width:400px;max-height:80vh;border-radius:20px;box-shadow:var(--shadow-2);border:1px solid var(--outline);background:var(--surface)}}
.notif-panel .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--outline-2)}
.notif-panel .hd h2{flex:1;font-size:18px}
.notif-panel .bd{overflow-y:auto;padding:4px 16px 24px}
.search-box{display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;background:var(--surface);border:1.5px solid var(--outline);padding:0 14px}
.search-box input{border:0;outline:none;flex:1;background:transparent;min-width:0}
.pri-urgent{border-left:4px solid var(--red)}
.big-num{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
.donut{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.donut:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
.donut b{position:relative;font-size:18px}
.role-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff}
.two-col{display:grid;gap:12px}
@media (min-width:640px){.two-col{grid-template-columns:1fr 1fr}}
.hint{background:var(--yellow-c);border-radius:12px;padding:10px 12px;font-size:13px;color:#7A5600;display:flex;gap:8px;align-items:flex-start}
.demo-tip{position:fixed;left:12px;bottom:calc(var(--nav-h) + 12px + var(--safe-b));z-index:28;font-size:11px;color:var(--ink-3);background:rgba(255,255,255,.8);padding:4px 8px;border-radius:8px;display:none}

</style>
</head>

/* ===== Bus simulation ===== */
const ROUTE_PATHS = {
  R12:"M30,220 C70,190 60,140 110,130 S180,160 210,110 S300,60 340,80 S380,40 380,40",
  R7:"M40,60 C90,40 120,120 180,110 S260,180 320,150 S380,60 380,60",
  R3:"M40,200 C120,190 150,90 220,90 S330,150 380,60",
  R19:"M30,80 C80,120 120,60 190,100 S280,220 380,140",
  R5:"M40,120 C150,60 250,190 380,120"
};
setInterval(()=>{
  let changed=false;
  BUSES.forEach(b=>{ if(b.status==="moving"){ const s=state.bus[b.id]; s.progress=Math.min(1,s.progress+0.0018); if(s.progress>=1){ b.status="arrived"; changed=true; } } });
  if(state.user && (state.route==="transport" || (state.route==="home"&&state.user.role==="student"))){ if(changed) render(); else updateBusDOM(); }
},1000);
function busPoint(id, progress){ const p=$(`#path-${id}`); if(!p) return null; const L=p.getTotalLength(); return p.getPointAtLength(L*progress); }
function busStopIndex(b){ const p=state.bus[b.id].progress; const n=b.stops.length-1; return Math.min(n, Math.floor(p*n+1e-9)); }
function busEta(b){ const p=state.bus[b.id].progress; const n=b.stops.length-1; if(p>=1||b.status!=="moving") return null; const idx=Math.floor(p*n); const frac=p*n-idx; const remainingLegs=(n-idx-frac); return Math.max(1,Math.round(remainingLegs*7)); }
function updateBusDOM(){
  BUSES.filter(b=>b.status==="moving").forEach(b=>{ const pt=busPoint(b.id,state.bus[b.id].progress); const m=$(`#bus-${b.id}`); if(pt&&m){ m.setAttribute("transform",`translate(${pt.x},${pt.y})`);} const e=document.querySelector(`[data-eta="${b.id}"]`); if(e){ const eta=busEta(b); e.textContent = eta ? `${eta} min` : "Arrived"; } });
}
function busMapSVG(b, opts={}){
  const s=state.bus[b.id]; const n=b.stops.length-1;
  // compute stop points on the path once rendered: place markers using a temp path via a hidden svg
  const tmp=document.createElementNS("http://www.w3.org/2000/svg","svg"); const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",ROUTE_PATHS[b.id]); tmp.appendChild(p); document.body.appendChild(tmp); const L=p.getTotalLength();
  const pts=b.stops.map((st,i)=>p.getPointAtLength(L*i/n)); const cur=p.getPointAtLength(L*s.progress); document.body.removeChild(tmp);
  const homeIdx = opts.homeStop ?? -1;
  const stopsSvg = pts.map((pt,i)=>{ const done=(s.progress*n)>=i-1e-9; const isSchool=i===n; const isHome=i===homeIdx;
    return `<g transform="translate(${pt.x},${pt.y})">${isHome?`<circle r="14" fill="#0F9D93" opacity=".18"/>`:""}<circle r="${isSchool?9:6}" fill="${isSchool?"#0F1F3D":done?"#12A150":"#fff"}" stroke="${done?"#12A150":"#8A94AB"}" stroke-width="2.5"/>${isSchool?`<text y="-16" text-anchor="middle" font-size="11" font-weight="600" fill="#0F1F3D">School</text>`:""}${isHome?`<text y="-14" text-anchor="middle" font-size="11" font-weight="600" fill="#0A6F68">Your stop</text>`:""}</g>`; }).join("");
  const status = b.status==="moving"?"Moving":b.status==="arrived"?"Arrived at school":b.status==="needs-driver"?"No driver assigned":"In maintenance";
  return `<div class="map"><svg viewBox="0 0 420 260" role="img" aria-label="Live map of ${esc(b.route)}">
    <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#D9E3D9" stroke-width="1"/></pattern></defs>
    <rect width="420" height="260" fill="url(#grid)"/>
    <path d="M0,150 Q100,140 210,160 T420,140" stroke="#CBD6E4" stroke-width="10" fill="none" opacity=".7"/><path d="M0,150 Q100,140 210,160 T420,140" stroke="#fff" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
    <path d="M120,0 Q140,120 100,260" stroke="#CBD6E4" stroke-width="8" fill="none" opacity=".7"/>
    <path d="M60,40 h50 v30 h-50z M300,190 h70 v40 h-70z M240,20 h40 v25 h-40z M20,230 h60 v20 h-60z" fill="#DFE8DF"/>
    <path id="path-${b.id}" d="${ROUTE_PATHS[b.id]}" fill="none" stroke="#1F5AF6" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    ${stopsSvg}
    <g id="bus-${b.id}" transform="translate(${cur.x},${cur.y})">${b.status==="moving"?`<circle r="18" fill="#1F5AF6" opacity=".15"><animate attributeName="r" values="14;24;14" dur="2s" repeatCount="indefinite"/></circle>`:""}<circle r="13" fill="${b.status==="moving"||b.status==="arrived"?"#1F5AF6":"#8A94AB"}"/><svg x="-8" y="-8" width="16" height="16" viewBox="0 0 24 24"><path fill="#fff" d="${ICON_PATHS.bus}"/></svg></g>
  </svg><div class="status"><span class="live">${b.status==="moving"?"<i></i>":""}${status}</span>${b.delay?`<span class="live" style="color:#9A4D05">+${b.delay} min late</span>`:""}</div></div>`;
}
function busStopsList(b, homeStop=-1){
  const idx=busStopIndex(b); const s=state.bus[b.id]; const n=b.stops.length-1; const eta=busEta(b);
  return `<div class="stops">${b.stops.map((st,i)=>{ const done = s.progress*n >= i; const next = !done && i===Math.floor(s.progress*n)+1 && b.status==="moving"; const legs=i-s.progress*n; const et = done?"Passed": b.status!=="moving"? (b.status==="arrived"?"":"—") : `${Math.max(1,Math.round(legs*7))} min`;
    return `<div class="stop ${done?"done":""} ${next?"next":""}"><div class="ln"><i></i></div><div class="tx"><b>${esc(st.n)}${i===homeStop?' <span class="tag teal">Your stop</span>':""}</b><span>Scheduled ${ampm(st.t)}${b.delay?` · now ~${ampm(addMin(st.t,b.delay))}`:""}</span></div><span class="eta" ${next?`data-eta="${b.id}"`:""}>${et}</span></div>`; }).join("")}</div>`;
}
function addMin(t,m){ let [h,mi]=t.split(":").map(Number); mi+=m; h+=Math.floor(mi/60); mi%=60; return `${h}:${pad(mi)}`; }

PAGES.updates = () => {
  const u=state.user; let list = NOTICES.filter(n=>noticeVisibleTo(n,u));
  if(u.role==="teacher" && state.updatesFilter==="mine") list=list.filter(n=>n.author===u.name);
  if(state.updatesFilter==="urgent") list=list.filter(n=>n.priority==="urgent");
  if(state.updatesFilter==="scheduled") list=list.filter(n=>n.status==="scheduled");
  if(["Homework","Exam","Transport","Event"].includes(state.updatesFilter)) list=list.filter(n=>n.category===state.updatesFilter);
  list=[...list].sort((a,b)=>b.when.localeCompare(a.when));
  const filters = u.role==="student" ? ["all","Homework","Exam","Transport","Event"] : u.role==="teacher" ? ["all","mine","urgent","scheduled","Homework"] : ["all","urgent","scheduled","Exam","Transport","Event"];
  const lab = f=>({all:"All",mine:"Posted by me",urgent:"Urgent",scheduled:"Scheduled"}[f]||f);
  return `<div class="page-h between"><div><h1>School updates</h1><p>${u.role==="student"?"Announcements, homework and alerts for you":"Announcements, circulars and targeted broadcasts"}</p></div>${u.role!=="student"?`<button class="btn" data-act="go" data-route="compose">${ic("add","sm")} New</button>`:""}</div>
  <div class="chip-row mb">${filters.map(f=>`<button class="chip ${state.updatesFilter===f?"on":""}" data-act="filterUpdates" data-f="${f}">${lab(f)}</button>`).join("")}</div>
  <div class="card">${list.length?`<div class="list">${list.map(n=>noticeItem(n,{desc:true})).join("")}</div>`:emptyState("campaign","Nothing here yet","Try another filter or check back later.")}</div>`;
};

/* --- Calendar --- */
PAGES.calendar = () => {

  const cells=[]; for(let i=0;i<startDow;i++) cells.push(""); for(let d=1;d<=days;d++) cells.push(d);
  const sel = state.calSel; const evs = CAL.filter(e=>e.d===sel); const holidayBreak = d => d>="2026-09-19" && d<="2026-10-04";
  const monthList = CAL.filter(e=>e.d.startsWith(`${y}-${pad(mo+1)}`)).sort((a,b)=>a.d.localeCompare(b.d));
  return `<div class="page-h between"><div><h1>Calendar</h1><p>${SCHOOL.term} · Official school calendar</p></div>${state.user.role==="admin"?`<button class="btn" data-act="openSheet" data-kind="addEvent">${ic("add","sm")} Add</button>`:""}</div>

    <div class="between mb"><button class="icon-btn" data-act="calNav" data-d="-1" aria-label="Previous month">${ic("back")}</button><h3>${MONTHS[mo]} ${y}</h3><button class="icon-btn" data-act="calNav" data-d="1" aria-label="Next month" style="transform:scaleX(-1)">${ic("back")}</button></div>
    <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells.map((d,i)=>{ if(!d) return `<div class="d pad"></div>`; const iso=`${y}-${pad(mo+1)}-${pad(d)}`; const ev=CAL.filter(e=>e.d===iso); const wk=i%7>=5; const inBreak=holidayBreak(iso)&&!wk;

  </div><div class="stack">
    <div class="card"><div class="card-h"><h3>${fmtD(sel,{year:true})}</h3>${holidayBreak(sel)?'<span class="tag orange">Term break</span>':""}</div>${evs.length?`<div class="list">${evs.map(calItem).join("")}</div>`:emptyState("calendar","No events this day","Term 3 classes run as usual.")}</div>
    <div class="card"><div class="card-h"><h3>${MONTHS[mo]} at a glance</h3></div>${monthList.length?`<div class="list">${monthList.map(calItem).join("")}</div>`:emptyState("calendar","Nothing scheduled","")}</div>
  </div></div>`;
};

  return `<div class="shell">
    <nav class="rail" aria-label="Main"><div class="brand">${ic("school")}</div><button class="primary-action" data-act="go" data-route="${primary.r}" aria-label="${primary.l}">${ic(primary.i)}</button>${nav.map(n=>navBtn(n)).join("")}<div class="spacer"></div><button class="nav" data-act="logout"><span class="pill">${ic("logout")}</span><span>Sign out</span></button></nav>
    <nav class="drawer" aria-label="Main"><div class="brand"><div class="mark">${ic("school")}</div><div><b>${esc(SCHOOL.name)}</b><span>${esc(SCHOOL.term)}</span></div></div><button class="primary-action" data-act="go" data-route="${primary.r}">${ic(primary.i)} ${primary.l}</button>${nav.map(n=>navBtn(n)).join("")}<div class="spacer"></div><div class="me">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><span>${u.role[0].toUpperCase()+u.role.slice(1)}</span></div><button class="icon-btn" data-act="logout" aria-label="Sign out">${ic("logout")}</button></div></nav>
    <header class="topbar"><div class="ttl">${esc(title)}<small>${esc(SCHOOL.name)} · ${u.role[0].toUpperCase()+u.role.slice(1)}</small></div><button class="icon-btn" data-act="openNotif" aria-label="Notifications">${ic("bell")}${unread?`<span class="badge">${unread}</span>`:""}</button><button class="icon-btn" data-act="go" data-route="settings" aria-label="Profile">${avatar(u,32)}</button></header>
    <main class="content">${page}</main>
    <nav class="bottom-nav" aria-label="Main">${mobileNav}</nav>
    ${state.route!=="compose"&&state.route!=="transport"?`<button class="fab" data-act="go" data-route="${primary.r}">${ic(primary.i)} ${primary.l}</button>`:""}
  </div>`;
}
function render(){ const app=$("#app"); app.innerHTML = state.user ? shellHTML() : loginHTML(); $("#modal").innerHTML = state.user ? sheetHTML()+notifPanelHTML() : ""; document.body.style.overflow = (state.modal||state.notifOpen)?"hidden":""; }

/* ===== Actions ===== */
function readForm(id){ const el=document.getElementById(id); return el?el.value.trim():""; }
function addNotice(n){ n.id=++NOTICE_SEQ; NOTICES.unshift(n); ACTIVITY.unshift({when:"2026-09-14T09:20", who:state.user.name, what:`${n.status==="scheduled"?"Scheduled":"Published"} “${n.title}” to ${targetLabel(n.target)}`}); }
const ACTIONS = {
  login: el=>login(el.dataset.id), logout: ()=>logout(), back: ()=>state.params.cls?go("classDetail",{cls:state.params.cls,tab:"updates"}):go("updates"),
  go: el=>{ const p=el.dataset.params?JSON.parse(el.dataset.params):{}; if(el.dataset.route==="compose"&&p.cls) p.level="class"; go(el.dataset.route,p); },
  openSheet: el=>openSheet(el.dataset.kind,{id:el.dataset.id}), closeSheet: ()=>closeSheet(), switchRole: ()=>openSheet("switchRole"),
  openNotif: ()=>{ state.notifOpen=true; state.modal=null; render(); }, closeNotif: ()=>{ state.notifOpen=false; render(); },
  readAll: ()=>{ state.notifs[state.user.role].forEach(n=>n.read=true); render(); },
  openNotice: el=>{ const id=+el.dataset.id; if(state.user.role==="student") READ_BY_STUDENT.add(id); openSheet("notice",{id}); },
  openAssign: el=>openSheet("assign",{id:el.dataset.id}), openMsg: el=>openSheet("msg",{id:el.dataset.id}),
  dismissPush: ()=>{ $("#push").innerHTML=""; }, snack: el=>snack(el.dataset.msg),
  filterUpdates: el=>{ state.updatesFilter=el.dataset.f; render(); },
  setLevel: el=>{ state.params.level=el.dataset.level; keepCompose(); render(); }, setPri: el=>{ state.params.priority=el.dataset.p; keepCompose(); render(); }, setWhen: el=>{ state.params.schedule=el.dataset.w==="later"; keepCompose(); render(); },
  togglePush: ()=>{ state.params.push = state.params.push===false; keepCompose(); render(); }, toggleSelf: el=>el.classList.toggle("on"),
  attach: ()=>{ const s=$("#c-attach"); s.textContent="Term3_timetable.pdf (attached)"; snack("Attachment added","attach"); },
  publish: ()=>{ const title=readForm("c-title"), body=readForm("c-body"); if(!title){ snack("Add a title before publishing","warning"); $("#c-title").focus(); return; }
    const u=state.user, d=state.params; const level=d.level||(u.role==="admin"?"school":"class"); const value= level==="year"?+readForm("c-year"): level==="class"?readForm("c-class"): level==="route"?readForm("c-route"): undefined;
    const cat=readForm("c-cat"); const isAssign=d.kind==="assignment"; const sched=d.schedule; const when = sched?`${readForm("c-date")}T${readForm("c-time")}`:"2026-09-14T09:20";
    const reach={school:3026,year:452,class:26,route:41}[level];
    const n={ title, body: body||(isAssign?`Due ${fmtD(readForm("c-due"))}.`:""), category:cat, target:{level,value}, priority:d.priority||"normal", author:u.name, when, status:sched?"scheduled":"published", push:d.push!==false, recipients:reach, delivered:sched?0:reach-Math.round(reach*0.01), read:sched?0:Math.round(reach*0.12) };
    addNotice(n); if(isAssign) ASSIGNMENTS.push({id:"a"+Date.now(), cls:value||"8A", subject:"Mathematics", title, due:readForm("c-due")||"2026-09-18", status:"todo", teacher:"Ms Whitfield"});
    if(!sched){ state.notifs.student.unshift({id:"n"+Date.now(), title, body: body.slice(0,90)||cat, type: n.priority==="urgent"?"urgent":cat==="Homework"?"homework":"update", when, read:false, link:{route:"updates",id:n.id}}); }
    go(d.cls?"classDetail":"updates", d.cls?{cls:d.cls,tab:"updates"}:{});
    snack(sched?`Scheduled for ${fmtD(when)} at ${fmtT(when)}`:`Published to ${targetLabel(n.target)} · ${reach.toLocaleString()} recipients`);
    if(!sched && n.push) setTimeout(()=>pushToast({title, body: body.slice(0,90)||`${cat} · ${targetLabel(n.target)}`, type:n.priority==="urgent"?"urgent":"update"}),700); },
  publishNow: el=>{ const n=NOTICES.find(x=>x.id===+el.dataset.id); n.status="published"; n.when="2026-09-14T09:20"; n.delivered=n.recipients-30; n.read=Math.round(n.recipients*.1); closeSheet(); snack("Published now"); setTimeout(()=>pushToast({title:n.title,body:n.body.slice(0,90),type:"update"}),600); },
  resend: el=>{ const n=NOTICES.find(x=>x.id===+el.dataset.id); closeSheet(); snack(`Resent to ${(n.delivered-n.read).toLocaleString()} people who haven't read it`,"send"); },
  calNav: el=>{ const m=state.calMonth; state.calMonth=new Date(m.getFullYear(),m.getMonth()+ +el.dataset.d,1); render(); }, calSel: el=>{ state.calSel=el.dataset.d; render(); },
  saveEvent: ()=>{ const t=readForm("ev-title"); if(!t){ snack("Give the event a title","warning"); return; } const d=readForm("ev-date"), type=readForm("ev-type"); CAL.push({d,type,title:t}); state.calSel=d; state.calMonth=new Date(parseD(d).getFullYear(),parseD(d).getMonth(),1);
    if($("#ev-notify").classList.contains("on")){ addNotice({title:t, body:`${type==="holiday"?"The school is closed on":"Scheduled for"} ${fmtD(d,{year:true})}.`, category:type==="holiday"?"Holiday":type==="exam"?"Exam":"Event", target:{level:"school"}, priority:"normal", author:state.user.name, when:"2026-09-14T09:20", status:"published", push:true, recipients:3026, delivered:2990, read:300}); setTimeout(()=>pushToast({title:t, body:fmtD(d,{year:true}), type:"update"}),700); }
    closeSheet(); snack("Added to the school calendar"); },
  examYear: el=>{ state.examYear=+el.dataset.y; render(); }, toggleReminders: ()=>{ state.reminders=!state.reminders; render(); snack(state.reminders?"Exam reminders on":"Exam reminders off","bell"); },
  examAction: el=>{ const e=EXAMS.find(x=>x.id===el.dataset.id); if(e.status==="upcoming"){ e.status="published"; addNotice({title:`Year ${e.year} ${e.subject} exam published — ${fmtD(e.date)}`, body:`${ampm(e.time)} · ${e.dur} min · ${e.venue}. Sections ${e.sections}.`, category:"Exam", target:{level:"year",value:e.year}, priority:"normal", author:"Curriculum Office", when:"2026-09-14T09:20", status:"published", push:true, recipients:452, delivered:448, read:40}); render(); snack(`Published to Year ${e.year} with push notification`); setTimeout(()=>pushToast({title:`${e.subject} exam published`, body:`${fmtD(e.date)} · ${ampm(e.time)} · ${e.venue}`, type:"exam"}),700); } else openSheet("examChange",{id:e.id}); },
  applyExamChange: el=>{ const e=EXAMS.find(x=>x.id===el.dataset.id); e.date=readForm("ex-date")||e.date; e.time=readForm("ex-time").replace(/^0/,"")||e.time; e.venue=readForm("ex-venue")||e.venue; e.status="postponed"; if(e.date>=isoToday()) { const i=CAL.findIndex(c=>c.type==="exam"&&c.title.includes(e.subject)&&c.title.includes(`Year ${e.year}`)); if(i>-1) CAL[i].d=e.date; }
    addNotice({title:`Change: Year ${e.year} ${e.subject} exam moved to ${fmtD(e.date)}`, body:`New time ${ampm(e.time)} at ${e.venue}. Duration unchanged (${e.dur} min).`, category:"Exam", target:{level:"year",value:e.year}, priority:"urgent", author:"Curriculum Office", when:"2026-09-14T09:20", status:"published", push:true, recipients:452, delivered:450, read:25}); closeSheet(); snack(`Year ${e.year} notified of the change`); setTimeout(()=>pushToast({title:`Exam change: ${e.subject}`, body:`Now ${fmtD(e.date)} · ${ampm(e.time)} · ${e.venue}`, type:"exam"}),700); },
  saveExam: ()=>{ const s=readForm("ex-sub"); if(!s){ snack("Enter a subject","warning"); return; } const y=+readForm("ex-year"); EXAMS.push({id:"e"+Date.now(), subject:s, date:readForm("ex-date"), time:readForm("ex-time").replace(/^0/,""), dur:+readForm("ex-dur")||60, year:y, sections:"A / B", venue:readForm("ex-venue")||"School Hall", status:"upcoming"}); state.examYear=y; closeSheet(); snack("Exam added as upcoming — publish when ready"); },
  selBus: el=>{ state.transportSel=el.dataset.id; state.params={id:el.dataset.id}; render(); },
  saveDriver: el=>{ const b=BUSES.find(x=>x.id===el.dataset.id); b.driver=readForm("dr-name").replace(" (relief)",""); if(b.status==="needs-driver") b.status="scheduled"; if(b.status==="scheduled"){ b.status="moving"; state.bus[b.id].progress=0.05; } ACTIVITY.unshift({when:"2026-09-14T09:20", who:state.user.name, what:`Assigned driver ${b.driver} to ${b.route}`}); const notify=$("#dr-notify").classList.contains("on"); closeSheet(); snack(`${b.driver} assigned to ${b.route}${notify?" · families notified":""}`); if(notify) setTimeout(()=>pushToast({title:`${b.route}: relief driver assigned`, body:`${b.driver} will operate ${b.route}. Times unchanged.`, type:"bus"}),700); },
  busBack: el=>{ const b=BUSES.find(x=>x.id===el.dataset.id); b.status="moving"; b.run="Morning run"; b.riders=44; state.bus[b.id].progress=0.02; render(); snack(`${b.route} returned to service`); },
  peopleTab: el=>{ state.peopleTab=el.dataset.t; render(); },
  saveStudent: ()=>{ const f=readForm("st-first"), l=readForm("st-last"); if(!f||!l){ snack("Enter the student's name","warning"); return; } const c=readForm("st-class"); if(!ROSTERS[c]) ROSTERS[c]=[]; ROSTERS[c].unshift({id:`${c}-${Date.now()}`, name:`${f} ${l}`, section:c, att:100}); ACTIVITY.unshift({when:"2026-09-14T09:20", who:state.user.name, what:`Added student ${f} ${l} to ${c}`}); state.peopleQ=""; state.peopleTab="students"; closeSheet(); snack(`${f} ${l} added to ${c} · invitation sent`); },
  att: el=>{ const {cls,id,v}=el.dataset; state.attDraft[cls]=state.attDraft[cls]||{}; state.attDraft[cls][id]=v; render(); },
  submitAtt: el=>{ const cls=el.dataset.cls; const draft=state.attDraft[cls]||{}; const absent=Object.entries(draft).filter(([,v])=>v==="A").length, late=Object.entries(draft).filter(([,v])=>v==="L").length; state.attSubmitted[cls]="9:52 am"; const i=PENDING_TEACHER_ACTIONS.findIndex(a=>a.cls===cls); if(i>-1) PENDING_TEACHER_ACTIONS.splice(i,1); render(); snack(`${cls} roll submitted · ${absent} absent, ${late} late${absent?" · families notified":""}`); },
  submitAssign: el=>{ const a=ASSIGNMENTS.find(x=>x.id===el.dataset.id); a.status="submitted"; closeSheet(); snack("Submitted — your teacher has been notified"); },
  sendReply: ()=>{ const t=readForm("reply"); if(!t){ snack("Write a reply first","warning"); return; } closeSheet(); snack("Reply sent","send"); },
  sendNew: ()=>{ if(!readForm("nm-sub")&&!readForm("nm-body")){ snack("Add a subject or message","warning"); return; } closeSheet(); snack(`Message sent to ${readForm("nm-to")}`,"send"); },
  togglePref: el=>{ state.pushPrefs[el.dataset.k]=!state.pushPrefs[el.dataset.k]; render(); },
  nudge: el=>snack(`Reminder sent to ${el.dataset.who}`,"send")
};
function keepCompose(){ // preserve typed text across re-renders of the compose page
  state.params.title=readForm("c-title"); state.params.body=readForm("c-body"); const c=document.getElementById("c-cat"); if(c) state.params.category=c.value; }

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="openNotif" && el.dataset.id){ const n=state.notifs[state.user.role].find(x=>x.id===el.dataset.id); n.read=true; state.notifOpen=false; if(n.link.id&&n.link.route==="updates"){ go("updates"); openSheet("notice",{id:n.link.id}); } else go(n.link.route, n.link.id?{id:n.link.id}:(n.link.cls?{cls:n.link.cls,tab:"attendance"}:{})); return; }
  if(ACTIONS[act]) ACTIONS[act](el, e);
});
document.addEventListener("input", e=>{ if(e.target.id==="people-q"){ state.peopleQ=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#people-q"); if(q){ q.focus(); q.setSelectionRange(pos,pos); } } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(state.modal) closeSheet(); else if(state.notifOpen){ state.notifOpen=false; render(); } } });
render();

</script>
